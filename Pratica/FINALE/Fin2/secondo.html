<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Esercizio individuale - Pagina con gatto</title>
        <style>
        /* General Styles */
* {
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
}
body{
	display: grid;
	grid-template-columns: 1fr 1fr;
}

section{
	width:100%;
	height:100%;
	display: flex;
	flex-direction: column;
	gap: 1rem;
	padding: 1rem;
}
main{
	padding: 1rem;	
}
ul{
	list-style: none;	
}
main > div{
	display: flex;
	width:100%;
}
main ul{
	overflow: auto;
	padding: 2rem;
	border: 2px solid black;
}

.card{
	border: 2px solid black;
	padding: 1rem;
	width:100%;
	height:10%;
	color: orange;
	overflow: auto;
}
        </style>
    </head>
    <body>
        <section>
        	<h1>Crea Voce</h1>
        	<ul>
        		<li>
        			<p>Titolo: </p>
        			<input type='text'required>
        			
        		</li>
        		<li>
        			<p>Data: </p>
        			<input type='date'required>
        			
        		</li>
        		<li>
        			<p>Descrizione: </p>
        			<textarea></textarea>
        			
        		</li>
        	</ul>
        	<button onClick='crea()'>Aggiungi Voce</button>
        </section>

        <main>
        	<h1>Diario:</h1>
        	<div>
        		<input type='text'id='myCerca'>
        		<button onClick='cerca()'>Cerca</button>
        	</div>
        	<ul>
        	
        	</ul>
        </main>
        
        <script>
        	let myVoci = [];	
        	
        
        
        	function crea(){
        		
        		const myTit = document.getElementsByTagName('input')[0];
        		const myData = document.getElementsByTagName('input')[1];
        		const myDec = document.getElementsByTagName('textarea')[0];
        		if(myTit.checkValidity() && myData.checkValidity() && myDec.value !='' ){
        			myVoci.push({titolo: myTit.value,data:myData.value,descrizione: myDec.value});
       			
        			
        		}
        		ricarica(myVoci);
        	}
        	
        	function ricarica(myArray){
        		const myCont = document.getElementsByTagName('ul')[1];
        		myCont.innerHTML = '';
        		for(let i in myArray){
        			const myLi = document.createElement('li');
        			const myTitolo = document.createElement('p');
        			const myData = document.createElement('p');
        			const myDesc = document.createElement('p');
        			const myBtn = document.createElement('button');
        			myBtn.textContent = 'Rimuovi';
        			myBtn.addEventListener('click',function(){remove(i,myArray)});
        			myTitolo.textContent = myArray[i].titolo;
        			myData.textContent = myArray[i].data;
        			myDesc.textContent = myArray[i].descrizione;
        			myLi.className = 'card';
        			
        			myLi.appendChild(myTitolo);
        			myLi.appendChild(myData);
        			myLi.appendChild(myDesc);
        			myLi.appendChild(myBtn);
        			
        			myCont.appendChild(myLi);
        		}
        		
        	}
        	function remove(i,myArray){
        		let eTo = myArray[i];
        		let temp = 0;
        		for(let i in myVoci){
        			if(eTo == myVoci[i]){
        				temp = i;
        			}
        		}
        		
        		myVoci.splice(temp,1);	
        		ricarica(myVoci);
        	}
        	function cerca(){
        		const myCerca = document.getElementById('myCerca').value;
        		let arrTrovati = [];
        		for(let e of myVoci){
        			if(e.titolo == myCerca){
        				arrTrovati.push(e);
        				
        			}
        			
        		}
        		ricarica(arrTrovati);
        	}
        	myVoci.push({titolo:'male',data:'12-12-2003',descrizione: 'festsa nonna'});
        	myVoci.push({titolo:'male',data:'12-12-2003',descrizione: 'festsa nonna'});
        	myVoci.push({titolo:'festa',data:'12-12-2003',descrizione: 'festsa nonna'});
        	myVoci.push({titolo:'regalo',data:'12-12-2002',descrizione: 'zia '});
        	ricarica(myVoci);
        </script>
    </body>
</html>
