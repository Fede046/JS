<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Document</title>
        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
            }
            body{
                
                font-family: 'Georgia';
                background-color: blue;
                color: white;
                padding:1rem;
            }
            header{
                text-align:center;
            }
            section{
                margin-top:1rem;
                
                display: grid;
                grid-template-rows:1fr;
                grid-template-columns: 1fr 1fr 1fr 1fr ;
                gap:1rem;
            }
            section div{
                display:flex;
                flex-direction:column;
                gap:0.5rem;
                padding:1rem;
                background-color: gray;
                border-radius: 10px;
                text-align: center;
                align-items:center;
                justify-content: center;
            }
            /*------------*/

            main {
                margin-top:1rem;
                display:grid;
                grid-template-areas:
                'box1 box2 box2'
                'box1 box2 box2';
                gap: 1rem;
            }
            main >div{
                background-color:white;
                color:black;
                border-radius:1rem;
                padding: 1rem;
                display:flex;
                flex-direction:column;
                gap:1rem;
            }
            input,select,textarea{
                font-size:1rem;
                padding: 0.5rem;
            }
            main div:nth-child(1) div{
                width:100%;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap:1rem;
                padding:0.5rem;
            }
            main div:nth-child(1) div button{
                padding:0.5rem 1rem 0.5rem 1rem;
                transition: all 0.3s;
                border-radius:10px;
            }
            main div:nth-child(1) div button:nth-child(1){
                
                border-color:red;
            }
            main div:nth-child(1) div button:nth-child(2){
                
                border-color:yellow;
            }
            main div:nth-child(1) div button:nth-child(3){
                
                border-color: green;
                
            }
            main div:nth-child(1) div button:nth-child(1).active{
                background-color:red;
            }
            main div:nth-child(1) div button:nth-child(2).active{
                background-color:yellow;
            }
            main div:nth-child(1) div button:nth-child(3).active{
                background-color:green;
            }
            main div:nth-child(1) > button{
                padding:0.5rem 1rem 0.5rem 1rem;
                background-color:blue;
                border-radius: 10px;
                color: white;

            }
            
            main div:nth-child(1) ul{
                display: flex;
                flex-direction:column;
                gap: 0.3rem; 
            }
            main div:nth-child(1) ul button{
                
                border-radius: 10px;
                color: rgb(0, 0, 0); 
                text-align: left;
                padding:1rem;
            }
            /*---------------*/
            main div:nth-child(2) ul{
                border-bottom: 1px solid gray;

            }
            main div:nth-child(2) div{
                display:grid;
                height: 2rem;
                grid-template-columns: 1fr 1fr 1fr;
                gap:1rem;

            }

            main div:nth-child(2) button{
                border-radius: 10px;
                border: 1px solid gray;
            }
            main div:nth-child(2) button:hover{
                border: 1px solid black;
            }
            button{
                cursor: pointer;
                background-color: white;
            }
            /*----------------*/
            
            @media(max-width: 968px){
                section{
                    
                    grid-template-columns: 1fr 1fr;
                    grid-template-rows: 1fr 1fr;
                    
                }
                main{
                    grid-template-areas: 
                    'box1'
                    'box2';
                }
            }
            
            @media(max-width: 600px){
                section{
                    
                    grid-template-columns: 1fr;
                    grid-template-rows: 1fr 1fr 1fr 1fr;
                }
            }

            </style>
    </head>
    <body>  
        <header>
            <h1>📋 Task Manager Pro</h1>
            <p>Organizza le tue attività in modo efficiente</p>
        </header>

        <section>
            <div>
                <h1>0</h1>
                <p>Totale task</p>
            </div>
            <div>
                <h1>0</h1>
                <p>Completati</p>
            </div>
            <div>
                <h1>0</h1>
                <p>In Attesa</p>
            </div>
            <div>
                <h1>0</h1>
                <p>Tasso Completamento</p>
            </div>
        </section>

        <main>
            <div style="grid-area:box1">
                <h1>➕ Aggiungi Task</h1>
                <p>Titolo</p>
                <input type="text">
                <p>Descrizione</p>
                <textarea type="text"></textarea>
                <p>Categoria</p>
                <select>
                    <option>Ciao</option>
                </select>
                <p>Data Scadenza</p>
                <input type="date">
                <p>Priorità</p>
                <div>
                    <button>Alta</button>
                    <button>Media</button>
                    <button>Bassa</button>
                </div>
                <button>Aggiungi Task</button>

                <h1>Filtri</h1>
                <p>Stato</p>
                <ul>
                  <button>Tutti</button>
                  <button>Attivi</button>
                  <button>Completati</button>
                </ul>
                <p>Priorità</p>
                <ul>
                    <button>Tutte</button>
                    <button>Alta</button>
                    <button>Media</button>
                    <button>Bassa</button>
                </ul>

            </div>

            <div style="grid-area:box2">
                <h1>📝 Le Tue Task</h1>
                <input type="text">
                <ul></ul>
                <div>
                    <button>Elimina Cpmpletati</button>
                    <button>Esplora Lista</button>
                    <button>Reset Tutto</button>
                </div>


            </div>



        </main>

        

        <script>

        </script>
    </body>
</html>
