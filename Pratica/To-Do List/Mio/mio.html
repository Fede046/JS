<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: 'Georgia';
            background-color: blue;
            color: white;
            padding: 1rem;
        }

        header {
            text-align: center;
        }

        section {
            margin-top: 1rem;

            display: grid;
            grid-template-rows: 1fr;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 1rem;
        }

        section div {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
            background-color: gray;
            border-radius: 10px;
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        /*------------*/

        main {
            margin-top: 1rem;
            display: grid;
            grid-template-areas:
                'box1 box2 box2'
                'box1 box2 box2';
            gap: 1rem;
        }

        main>div {
            background-color: white;
            color: black;
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input,
        select,
        textarea {
            font-size: 1rem;
            padding: 0.5rem;
            border-radius: 10px;
        }

        main>div:nth-child(1) div {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            padding: 0.5rem;
        }

        main>div:nth-child(1) div button {
            padding: 0.5rem 1rem 0.5rem 1rem;
            transition: all 0.3s;
            border-radius: 10px;
        }

        main>div:nth-child(1) div button:nth-child(1) {
            border-color: red;
        }

        main>div:nth-child(1) div button:nth-child(2) {

            border-color: yellow;
        }

        main>div:nth-child(1) div button:nth-child(3) {

            border-color: green;

        }

        main>div:nth-child(1) div button:nth-child(1).active {
            background-color: red;
        }

        main>div:nth-child(1) div button:nth-child(2).active {
            background-color: yellow;
        }

        main>div:nth-child(1) div button:nth-child(3).active {
            background-color: green;
        }

        main>div:nth-child(1)>button {
            padding: 0.5rem 1rem 0.5rem 1rem;
            background-color: red;
            border-radius: 10px;
            color: white;

        }

        main>div:nth-child(1) ul {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        main>div:nth-child(1) ul button {

            border-radius: 10px;
            color: rgb(0, 0, 0);
            text-align: left;
            padding: 1rem;
        }

        main>div:nth-child(1) ul button.active {
            background-color: blue;
            color: white;
        }


        /*---------------*/
        main>div:nth-child(2) ul {
            border-bottom: 1px solid gray;

        }

        main>div:nth-child(2) div {
            display: grid;
            height: 2rem;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;

        }

        main>div:nth-child(2) button {
            border-radius: 10px;

            border: 1px solid gray;
        }

        main>div:nth-child(2) button:hover {
            border: 1px solid black;
        }

        button {
            cursor: pointer;
            background-color: white;
        }

        /*----------------*/

        @media(max-width: 968px) {
            section {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;

            }

            main {
                grid-template-areas:
                    'box1'
                    'box2';
            }
        }

        @media(max-width: 600px) {
            section {

                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    </header>

    <section>

    <main>

            <button onClick="btnAddTask()">Aggiungi Task</button>

            <h1>Filtri</h1>

            <ul id="ulStato">
                <li><button>Tutti</button></li>

            </ul>
            <p>Priorità</p>
            <ul id="ulPrio">
                <li><button>Tutte</button></li>
                <li><button>Alta</button></li>
                <li><button>Media</button></li>
                <li><button>Bassa</button></li>

            </ul>

        </div>

        <div style="grid-area:box2">
            <h1>📝 Le Tue Task</h1>
            <input type="text">

                    <button>Modifica</button>
                    <button>Elimina</button>
                </div>


            </div>
            <div>
                <button>Elimina Cpmpletati</button>
                <button>Esplora Lista</button>
                <button>Reset Tutto</button>
            </div>


        </div>



    </main>



    <script>

        const list_Prio = ['Alta', 'Media', 'Bassa'];
        const list_FilPrio = ['Tutte', 'Alta', 'Media', 'Bessa'];
        const list_Stato = ['Tutti', 'Attivi', 'Completati'];
        let index_Prio = 0;
        let index_FilPrio = 0;
        let index_Stato = 0;

        let list_Task = [];

        class Task {
            costructor(titolo, descrizione, categoria, data, prio) {
                this._titolo = titolo;
                this._descriozione = descrizione;
                this._categoria = categoria;
                this._data = data;
                this._prio = prio;
            }
            get titolo() {
                return this._titolo;
            }
            get descrizione() {
                return this._descrizione;
            }
            get categoria() {
                return this._categoria;
            }
            get data() {
                return this._data;
            }
            get prio() {
                return this._prio;
            }
        }



        function start() {
            prioritaBottoni('divPrio');
            prioritaBottoni('ulStato');
            prioritaBottoni('ulPrio');

        }

        function prioritaBottoni(divName) {
            const myDiv = document.getElementById(divName);
            const myButt = Array.from(myDiv.getElementsByTagName('button'));

            for (let i = 0; i < myButt.length; i++) {

                myButt[i].addEventListener('click', function () {
                    attivaPrio(divName, i);
                });
            }
        }
        function attivaPrio(divName, num) {
            const myDiv = document.getElementById(divName);
            const myButt = Array.from(myDiv.getElementsByTagName('button'));

            for (let i = 0; i < myButt.length; i++) {
                if (num == i) {

                    if (divName == 'divPrio') {
                        index_Prio = i;
                    } else if (divName == 'ulStato') {
                        index_FilPrio = i;
                    } else {
                        index_Stato = i;
                    }

                    myButt[i].className = 'active';
                } else {
                    myButt[i].className = '';
                }

            }
        }

        function btnAddTask() {
            const titolo = document.getElementById('myTitle').value;
            const descrizione = document.getElementById('myDes').value;
            const categoria = document.getElementById('myCat').value;
            const data = document.getElementById('myDate').value;
            const prio = list_Prio[index_Prio];

            list_Task.push(new Task(titolo, descrizione, categoria, data, prio));
        }

        function aggiornaTask() {

        }









        start();
    </script>
</body>

</html>
